packages:
  - apps/*
  - packages/*
  - legacy/*

# Versões compartilhadas ficam aqui, para o monorepo inteiro usar a mesma.
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.10.1
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.1.0
  zod: 4.6.7

# Scripts de instalação só rodam para os pacotes abaixo. É uma defesa contra pacotes comprometidos.
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Telemetria de instalação, trazida pelo swagger-ui. Fica bloqueada.
  '@scarf/scarf': false
  unrs-resolver: true
  # Trazidos pelo Testcontainers. Os dois primeiros só aceleram SSH, que não usamos.
  cpu-features: false
  ssh2: false
  # O script só avisa sobre versões antigas do Node.
  protobufjs: false

minimumReleaseAgeExclude:
  - lucide-react@1.68.0
  - '@nestjs/common@12.3.3'
  - '@nestjs/core@12.3.3'
  - '@nestjs/platform-express@12.3.3'
  - '@nestjs/testing@12.3.3'
  - '@tanstack/query-core@5.106.0'
  - '@tanstack/react-query@5.106.0'
