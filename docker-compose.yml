# Serviços só para desenvolvimento, acessíveis apenas pela máquina local.
# Requer o .env gerado por `pnpm setup:env`.
name: escala

services:
  postgres:
    # Imagem multiarquitetura: a postgis/postgis oficial só tem amd64. Ver ADR-0010.
    image: imresamu/postgis:18-3.6
    restart: unless-stopped
    environment:
      # Banco só de administração. A imagem instala extensões em público nele, por isso
      # o banco do app é criado à parte, limpo, pelo `pnpm db:setup`.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?rode pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode pnpm setup:env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do PostgreSQL 18, o volume fica em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?rode pnpm setup:env}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?rode pnpm setup:env}

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
